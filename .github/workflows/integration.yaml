name: database-validation
on:
  pull_request:
  push:
    branches: [main, develop, integration, production, 'feature/**', 'release/**', 'hotfix/**', 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' build twine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:release
      - run: pytest tests/unit tests/integration/test_services.py
      - run: python -m build && python -m twine check dist/*
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/provider-wheel"
          "$RUNNER_TEMP/provider-wheel/bin/pip" install --no-deps --force-reinstall dist/*.whl
          cp scripts/check_wheel.py "$RUNNER_TEMP/check_provider_wheel.py"
          cd "$RUNNER_TEMP"
          VIRTUAL_ENV="$RUNNER_TEMP/provider-wheel" "$RUNNER_TEMP/provider-wheel/bin/python" check_provider_wheel.py
  integration:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: provider
          POSTGRES_PASSWORD: provider
          POSTGRES_DB: provider_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provider"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://provider:provider@localhost:5432/provider_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest tests/integration/test_migrations.py
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: python -m pip install -e '.[docs]'
      - run: make html pdf
